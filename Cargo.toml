[workspace]
members = [
    "crates/riot-app-cli",
    "crates/riot-anchor",
    "crates/riot-anchor-protocol",
    "crates/riot-client-net",
    "crates/riot-core",
    "crates/riot-transport",
    "crates/riot-ffi",
    "crates/riot-conformance",
    "crates/xtask",
]
exclude = ["vendor/tor-dirmgr-0.44.0", "vendor/willow25-0.6.0-alpha.3", "vendor/bab_rs-0.8.1"]
resolver = "2"

[workspace.dependencies]
# Alpha pin is evidence-specific: stable 0.5.0 resolves a bab_rs that
# computes incorrect WILLIAM3 digests (see docs/research/2026-07-10-willow-
# implementation-audit.md). Drop Format stays disabled.
willow25 = { version = "=0.6.0-alpha.3", default-features = false, features = ["std"] }
bab_rs = { version = "=0.8.1", default-features = false, features = ["william3"] }
uniffi = "=0.32.0"
camino = "=1.2.4"
minicbor = { version = "=2.2.2", features = ["std"] }
cddl-cat = "=0.7.1"
sha2 = "=0.10.9"
blake3 = "=1.8.5"
# Already in the willow25 transitive graph; direct pins so riot-core can
# drive the async codec traits synchronously. Recorded in the WU0R report.
pollster = "=0.4.0"
ufotofu = { version = "=0.12.4", features = ["std"] }
hifitime = "=4.3.0"
# xtask structural contract parsing only.
toml = "=0.9.8"
serde_json = "=1.0.145"
serde = "=1.0.228"
libc = "=0.2.186"
tempfile = "=3.27.0"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize", "rand_core"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
zeroize = "=1.9.0"
# Mature RustCrypto AEAD pin for versioned local signer-state sealing. 0.11.0
# is newer, but 0.10.1 is the established stable line used for this boundary.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
# Lowercase RFC 4648 base32 for self-certifying Earthstar-style identity
# handles. Already in the resolved graph transitively; pinned as a direct dep
# so riot-core can encode 32-byte keys without a new resolved version.
data-encoding = "=2.11.0"
# Physical database for the multi-space store. Bundling fixes SQLite and JSON
# behavior across iOS, Android, and macOS instead of inheriting each OS build.
rusqlite = { version = "=0.40.1", default-features = false, features = ["backup", "blob", "bundled", "hooks", "limits", "serde_json"] }
# Structured logging for the sync engine, newswire reply path, and FFI.
# Already resolved transitively (iroh/tokio pull tracing); pinned here as
# direct deps so riot-core and riot-ffi can emit spans without a version bump.
# wasm-safe in riot-core (macros are no-ops without a subscriber).
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "registry", "std"] }
# Per-test subscriber capture for the sync-tracing contract tests.
# `no-env-filter` widens the per-test filter to "trace" so events emitted under
# our `riot::sync` / `riot::newswire` targets (chosen for os_log categorization)
# are captured by the in-memory test subscriber regardless of crate name.
tracing-test = { version = "=0.2.6", features = ["no-env-filter"] }
# Apple unified-logging Layer; native-only (cfg-gated in riot-ffi).
tracing-oslog = "=0.3.0"

[patch.crates-io]
# Arti 0.44 caps rusqlite below 0.40 even though tor-dirmgr's used API remains
# compatible with 0.40.1. Keep Riot's pinned SQLite 3.53.2 engine by carrying
# the upstream crate with only that dependency bound widened; see RIOT_PATCH.md.
tor-dirmgr = { path = "vendor/tor-dirmgr-0.44.0" }
# willow25/bab_rs carry Riot's feature-gating patches: the persistent storage
# chain (fjall, async-fs, bab_rs backend_filesystem) is opt-in so wasm builds
# can exclude it; see RIOT_PATCH.md in each vendored crate.
willow25 = { path = "vendor/willow25-0.6.0-alpha.3" }
bab_rs = { path = "vendor/bab_rs-0.8.1" }

# Evidence profile must unwind: the FFI boundary catches panics and
# quarantines the session; abort would make that contract impossible.
[profile.release]
panic = "unwind"

# Dev/test builds carry only line tables, not full DWARF. Backtraces still show
# file:line; debuggers lose variable inspection. In exchange every dev + test +
# bench compile links less debug info and writes far less to target/ (which had
# grown to 24 GB, ~5.7 GB of it incremental/debug state). `test` and `bench`
# inherit `dev`, so this one profile covers the whole non-release graph.
[profile.dev]
debug = "line-tables-only"
