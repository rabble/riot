[package]
name = "riot-transport"
version = "0.1.0"
edition = "2021"
publish = false

# iroh + tokio live HERE, never in riot-core (which must stay pure/wasm-clean).
# This crate is a thin adapter: iroh Connection ⇄ ByteSyncSession ⇄ ReconcileSession.
[dependencies]
iroh = "1.0.2"
# The transport needs only the pure reconcile/sync surface of riot-core, never
# its SQLite store — mirror the anchor crate and keep the default `sqlite`
# feature OFF so the adapter stays lean and wasm-agnostic at this boundary.
riot-core = { path = "../riot-core", default-features = false }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "io-util", "time"] }
# Ticket floor is ROOT-SIGNED and verified before any dial (§5.1) — pure crypto.
ed25519-dalek = { workspace = true }
getrandom = "0.2"
# Optional Tor (Arti) outbound transport. Behind the `arti` feature so the
# default workspace build pulls no Arti/Tor crates (heavy; would disturb the
# lock tree and slow every CI run). The `tokio` feature on arti-client makes
# DataStream implement tokio's AsyncRead/AsyncWrite — the shape pump consumes.
# Pinned per-crate (like iroh), deliberately NOT a workspace dependency.
arti-client = { version = "0.44.0", optional = true, features = ["tokio"] }
tor-rtcompat = { version = "0.44.0", optional = true }

[features]
default = []
# Enable the Tor/Arti outbound dialer. Adds arti-client + tor-rtcompat. The
# TorConnect trait + TorDialer are always available (so the dialer is unit-
# testable without Tor); this feature gates only the real arti_client impl.
arti = ["dep:arti-client", "dep:tor-rtcompat"]

[dev-dependencies]
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "macros", "time", "io-util"] }
