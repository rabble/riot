[package]
name = "riot-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
ed25519-dalek = { workspace = true }
minicbor = { workspace = true }
riot-core = { path = "../riot-core" }
uniffi = { workspace = true }
willow25 = { workspace = true }
zeroize = { workspace = true }
# Spans emitted by the sync_* and create_newswire_* entry points, plus the
# os_log bridge installed by init_logging(). Subscriber + Layer only.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Apple unified-logging bridge. Native Apple targets only so Linux CI compiles.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
tracing-oslog = { workspace = true }

[dev-dependencies]
minicbor = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing-test = { workspace = true }
